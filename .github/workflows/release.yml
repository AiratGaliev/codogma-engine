name: Release Codogma Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: release-archive
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/editor/package-lock.json
            packages/localization/package-lock.json
            packages/editor-mcp-server/package-lock.json

      - name: Install locked dependencies (root)
        run: npm ci

      - name: Install locked dependencies (native Editor Host)
        run: npm ci
        working-directory: src/editor

      - name: Install locked dependencies (localization package)
        run: npm ci
        working-directory: packages/localization

      - name: Install locked dependencies (first-party MCP package)
        run: npm ci
        working-directory: packages/editor-mcp-server

      - name: Build native Editor Host and Core
        run: npm run build:editor-host

      - name: Build localization package
        run: npm run build:localization

      - name: Build first-party MCP package
        run: npm run build:mcp

      - name: Smoke test (server boots, native Editor Host and Project respond)
        shell: bash
        run: |
          set -euo pipefail
          SERVER_LOG="$RUNNER_TEMP/codogma-engine-release.log"
          PORT=3100 PROJECT_DIR=packages/cge/tests/fixtures/acceptance-project node server/server.mjs >"$SERVER_LOG" 2>&1 &
          SRV=$!
          cleanup() {
            kill "$SRV" 2>/dev/null || true
            wait "$SRV" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/editor/ -o "$RUNNER_TEMP/editor.html"; then
              break
            fi
            if ! kill -0 "$SRV" 2>/dev/null; then
              cat "$SERVER_LOG"
              exit 1
            fi
            sleep 1
          done

          test -s "$RUNNER_TEMP/editor.html"
          grep -q 'id="root"' "$RUNNER_TEMP/editor.html"
          grep -q "Codogma Engine" "$RUNNER_TEMP/editor.html"
          curl -fsS http://127.0.0.1:3100/editor/project/project.json | grep -q '"schemaVersion": 1'

      - name: Pack native release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          zip -qr release/codogma-engine.zip \
            server packages/cge packages/localization src/editor packages/editor-mcp-server \
            package.json package-lock.json README.md BUILD.md LICENSE CHANGELOG.MD \
            -x "src/editor/node_modules/*" \
            -x "packages/*/node_modules/*" \
            -x "*.log"

          unzip -Z1 release/codogma-engine.zip | grep -qx "src/editor/dist/index.html"
          unzip -Z1 release/codogma-engine.zip | grep -qx "packages/cge/dist/index.js"
          unzip -Z1 release/codogma-engine.zip | grep -qx "packages/editor-mcp-server/dist/cli.js"
          if unzip -Z1 release/codogma-engine.zip | grep -q '^source/editor/'; then
            echo "::error::Historical Editor sources must not be shipped in the native release archive."
            exit 1
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: codogma-engine-release
          path: release/codogma-engine.zip
          if-no-files-found: error
          retention-days: 30
