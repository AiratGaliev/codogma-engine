name: E2E

on:
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mcp-e2e:
    name: mcp-integration
    if: ${{ (github.base_ref == 'test' && github.head_ref == 'dev') || (github.base_ref == 'main' && (github.head_ref == 'test' || startsWith(github.head_ref, 'hotfix/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install compatible npm CLI
        run: |
          npm install --global npm@11.21.2 --no-audit --no-fund
          test "$(npm --version)" = "11.21.2"

      - name: Install root and all first-party workspace dependencies
        run: npm ci

      - name: Build and measure HTML5 Release artifact (COD-35)
        env:
          CODOGMA_HTML5_BUILD_EVIDENCE: ${{ runner.temp }}/html5-build-evidence.json
          CODOGMA_HTML5_BUILD_OUTPUT: ${{ runner.temp }}/html5-game-artifact
          CODOGMA_HTML5_ARCADE_OUTPUT: ${{ runner.temp }}/html5-arcade-artifact
        run: npm run test:html5-build

      - name: Build and typecheck SolidJS Host and Core workspace dependency
        run: npm run build --workspace=@codogma/editor-host

      - name: Run Editor Host domain tests
        run: npm test --workspace=@codogma/editor-host

      - name: Install Chromium for Editor Host browser E2E
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: src/editor

      - name: Run Editor Host browser E2E
        run: npm run test:browser
        working-directory: src/editor

      - name: Run full Phaser artifact smoke across browser engines (COD-35)
        shell: bash
        env:
          CODOGMA_HTML5_BUILD_OUTPUT: ${{ runner.temp }}/html5-game-artifact
          CODOGMA_HTML5_ENTRY: index.html
          CODOGMA_HTML5_EXPECT_VARIANT: full
          CODOGMA_HTML5_BASE_PATH: /promotion/full/
        run: |
          for browser in chromium firefox webkit; do
            export CODOGMA_HTML5_BROWSER="$browser"
            export CODOGMA_HTML5_PLAYWRIGHT_OUTPUT="test-results-html5/full/$browser"
            npm run test:html5-build:browser
          done
        working-directory: src/editor

      - name: Run Arcade-only UMD artifact smoke across browser engines (COD-35)
        shell: bash
        env:
          CODOGMA_HTML5_BUILD_OUTPUT: ${{ runner.temp }}/html5-arcade-artifact
          CODOGMA_HTML5_ENTRY: index-arcade.html
          CODOGMA_HTML5_EXPECT_VARIANT: arcade-only
          CODOGMA_HTML5_BASE_PATH: /promotion/arcade/
        run: |
          for browser in chromium firefox webkit; do
            export CODOGMA_HTML5_BROWSER="$browser"
            export CODOGMA_HTML5_PLAYWRIGHT_OUTPUT="test-results-html5/arcade-only/$browser"
            npm run test:html5-build:browser
          done
        working-directory: src/editor

      - name: Upload HTML5 artifact and browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codogma-html5-production-artifact
          path: |
            ${{ runner.temp }}/html5-build-evidence.json
            ${{ runner.temp }}/html5-game-artifact/
            ${{ runner.temp }}/html5-arcade-artifact/
            src/editor/test-results-html5/
          if-no-files-found: ignore
          retention-days: 14

      - name: Start server and run MCP integration tests
        shell: bash
        run: |
          set -euo pipefail
          SERVER_LOG="$RUNNER_TEMP/codogma-engine-e2e.log"
          export PORT=3100
          export CODOGMA_MCP_URL=http://127.0.0.1:3100/editor/mcp
          export PROJECT_DIR="$GITHUB_WORKSPACE/packages/cge/tests/fixtures/acceptance-project"

          node server/server.mjs >"$SERVER_LOG" 2>&1 &
          SRV=$!
          cleanup() {
            kill "$SRV" 2>/dev/null || true
            wait "$SRV" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/editor/mcp-bridge-status >/dev/null \
              && curl -fsS -X POST http://127.0.0.1:3100/editor/mcp \
                -H "Content-Type: application/json" \
                --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
                | grep -q '"tools"'; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat "$SERVER_LOG"
            echo "::error::Codogma Engine server or HTTP MCP endpoint did not become ready."
            exit 1
          fi

          npm run test:e2e

      - name: Upload Editor Host browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: editor-host-browser-e2e-failure
          path: |
            src/editor/test-results/
            src/editor/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload MCP diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: codogma-engine-mcp-e2e-diagnostics
          path: ${{ runner.temp }}/codogma-engine-e2e.log
          if-no-files-found: ignore
          retention-days: 7
