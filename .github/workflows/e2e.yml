name: E2E

on:
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mcp-e2e:
    name: mcp-integration
    if: ${{ github.event_name != 'pull_request' || (github.base_ref == 'test' && github.head_ref == 'dev') || (github.base_ref == 'main' && (github.head_ref == 'test' || startsWith(github.head_ref, 'hotfix/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/editor-mcp-server/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install and build standalone MCP package
        run: npm ci
        working-directory: packages/editor-mcp-server

      - name: Start server and run MCP integration tests
        shell: bash
        run: |
          set -euo pipefail
          SERVER_LOG="$RUNNER_TEMP/codogma-engine-e2e.log"
          export PORT=3100
          export CODOGMA_MCP_URL=http://127.0.0.1:3100/editor/mcp
          export PROJECT_DIR="$GITHUB_WORKSPACE/tests/workspace/test-typescript"

          node server/server.mjs >"$SERVER_LOG" 2>&1 &
          SRV=$!
          cleanup() {
            kill "$SRV" 2>/dev/null || true
            wait "$SRV" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/editor/product.json >/dev/null \
              && curl -fsS -X POST http://127.0.0.1:3100/editor/mcp \
                -H "Content-Type: application/json" \
                --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
                | grep -q '"tools"'; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat "$SERVER_LOG"
            echo "::error::Codogma Engine server or HTTP MCP endpoint did not become ready."
            exit 1
          fi

          npm run test:e2e

      - name: Upload MCP diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: codogma-engine-mcp-e2e-diagnostics
          path: ${{ runner.temp }}/codogma-engine-e2e.log
          if-no-files-found: ignore
          retention-days: 7
